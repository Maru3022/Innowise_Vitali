syntax = "proto3";

package com.example.innowise_vitali.grpc;

option java_multiple_files = true;
option java_package = "com.example.innowise_vitali.grpc";

message TokenRequest {
  string token = 1;
}

message TokenResponse {
  bool is_valid = 1;
  string username = 2;
  string role = 3;
}

service AuthGrpcService {
  rpc ValidateToken (TokenRequest) returns (TokenResponse);
}